# Configuración de despliegue en Netlify · RaízCaribe
# Sitio estático (HTML, CSS y JavaScript): no requiere compilación.
[build]
  publish = "."
  command = ""

# Cualquier ruta desconocida vuelve a la aplicación (el enrutado es por hash: #/rol/página)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
